[package]
name = "windows-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
pin-glide-http = { path = "../../generated/http-client" }
pin-glide-wss = { path = "../../generated/wss-models" }
qrcode = { version = "0.14", default-features = false }
receiver-core.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zeroize = "1"

[dev-dependencies]
aes-gcm.workspace = true
base64 = "0.23"
hpke = { workspace = true, features = ["getrandom"] }
native-tls = "0.2"
quircs = "0.10.3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
i-slint-core = { version = "=1.19.0", default-features = false }
slint = { workspace = true, features = ["unstable-winit-030"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[lints]
workspace = true
