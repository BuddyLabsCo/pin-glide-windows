[package]
name = "windows-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
pin-glide-http = { path = "../../generated/http-client" }
pin-glide-wss = { path = "../../generated/wss-models" }
qrcode = { version = "0.14", default-features = false }
receiver-core.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zeroize = "1"

[dev-dependencies]
native-tls = "0.2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
slint = { workspace = true, features = ["unstable-winit-030"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[lints]
workspace = true
