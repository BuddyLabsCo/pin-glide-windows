name: Service contracts

on:
  pull_request:
    paths:
      - 'scripts/contracts/**'
      - 'generated/**'
      - 'Cargo.lock'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/contracts/**'
      - 'generated/**'
      - 'Cargo.lock'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  regenerate:
    name: Service contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --prefix scripts/contracts --ignore-scripts
      - run: node scripts/contracts/generate.mjs --check
        env:
          GH_TOKEN: ${{ github.token }}
