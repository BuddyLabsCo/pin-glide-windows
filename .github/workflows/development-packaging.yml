name: Development packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Reject repository or organization origin
        if: ${{ vars.PINGLIDE_SERVICE_URL != '' }}
        run: |
          echo 'Define PINGLIDE_SERVICE_URL only in the development Environment.'
          exit 1
  package:
    needs: configuration
    runs-on: windows-2025
    environment: development
    steps:
      - uses: actions/checkout@v5
      - name: Install NSIS
        shell: pwsh
        run: ./packaging/windows/install-nsis.ps1
      - name: Build unsigned development installer
        shell: powershell
        env:
          PINGLIDE_SERVICE_URL: ${{ vars.PINGLIDE_SERVICE_URL }}
        run: .\packaging\windows\build.ps1 -Unsigned -DevelopmentTransport
      - name: Verify isolated installer lifecycle
        shell: powershell
        run: |
          .\packaging\windows\installer.test.ps1 `
            -Receiver .\target\x86_64-pc-windows-msvc\release\windows-app.exe `
            -Installer .\target\packaging\windows\Pin-Glide-Setup-x64-unsigned.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Pin-Glide-Setup-x64-unsigned
          path: target/packaging/windows/Pin-Glide-Setup-x64-unsigned.exe
          if-no-files-found: error
