name: Production release candidate

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  configuration:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'auto-release' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject repository or organization production variables
        if: >-
          vars.PINGLIDE_SERVICE_URL != '' ||
          vars.PINGLIDE_SIGNING_THUMBPRINT != '' ||
          vars.PINGLIDE_TIMESTAMP_URL != ''
        run: |
          echo 'Define release configuration only in the production Environment.'
          exit 1
  package:
    needs: configuration
    runs-on: windows-2025
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.13 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - name: Build and verify the authorized candidate
        id: candidate
        shell: powershell
        env:
          PINGLIDE_SERVICE_URL: ${{ vars.PINGLIDE_SERVICE_URL }}
          PINGLIDE_SIGNING_THUMBPRINT: ${{ vars.PINGLIDE_SIGNING_THUMBPRINT }}
          PINGLIDE_TIMESTAMP_URL: ${{ vars.PINGLIDE_TIMESTAMP_URL }}
        run: .\packaging\windows\production-candidate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-candidate
          path: |
            target/packaging/windows/${{ steps.candidate.outputs.filename }}
            target/packaging/windows/release-candidate.json
          if-no-files-found: error
