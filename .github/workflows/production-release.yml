name: Production release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  configuration:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'auto-release' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Check exact release eligibility
        id: release
        shell: pwsh
        run: ./packaging/windows/production-eligibility.ps1
      - name: Reject repository or organization production variables
        if: >-
          steps.release.outputs.eligible == 'true' &&
          (vars.PINGLIDE_SERVICE_URL != '' ||
          vars.PINGLIDE_SIGNING_THUMBPRINT != '' ||
          vars.PINGLIDE_TIMESTAMP_URL != '')
        run: |
          echo 'Define release configuration only in the production Environment.'
          exit 1
  package:
    needs: configuration
    if: ${{ needs.configuration.outputs.eligible == 'true' }}
    runs-on: windows-2025
    environment: production
    concurrency:
      group: production-release
      queue: max
    permissions:
      contents: write
      actions: read
    env:
      AUTHORIZED_COMMIT: ${{ needs.configuration.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.configuration.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Inspect publication and recover the original verified candidate
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/windows/production-publication.mjs prepare
      - name: Install NSIS
        if: steps.publication.outputs.plan == 'build'
        shell: pwsh
        run: ./packaging/windows/install-nsis.ps1
      - name: Build and verify the authorized candidate
        if: steps.publication.outputs.plan == 'build'
        id: candidate
        shell: powershell
        env:
          PINGLIDE_SERVICE_URL: ${{ vars.PINGLIDE_SERVICE_URL }}
          PINGLIDE_SIGNING_THUMBPRINT: ${{ vars.PINGLIDE_SIGNING_THUMBPRINT }}
          PINGLIDE_TIMESTAMP_URL: ${{ vars.PINGLIDE_TIMESTAMP_URL }}
        run: .\packaging\windows\production-candidate.ps1
      - uses: actions/upload-artifact@v4
        if: steps.publication.outputs.plan == 'build'
        with:
          name: production-release-candidate
          path: |
            target/packaging/windows/${{ steps.candidate.outputs.filename }}
            target/packaging/windows/release-candidate.json
          if-no-files-found: error
      - name: Publish the verified installer
        if: ${{ success() && (steps.publication.outputs.plan == 'publish' || steps.candidate.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/windows/production-publication.mjs publish
