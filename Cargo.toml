[workspace]
members = ["crates/receiver-core", "crates/windows-app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
receiver-core = { path = "crates/receiver-core" }
slint = { version = "=1.19.0", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "renderer-software",
    "std",
] }
slint-build = "=1.19.0"

[workspace.lints.clippy]
await_holding_lock = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
