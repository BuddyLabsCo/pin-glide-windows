<!doctype html>

     English preview copy; no backend, real pairing, system integration, or persistence. -->
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

.board.dark{--surface:#25282e;--pane:#202328;--ink:#eef0f4;--muted:#a3a9b5;--line:#3b3e46;--accent:#9cb8ff;--tint:#303c53;--green:#91d7b0;--good:#293b33;--shadow:0 20px 65px #0003;background:radial-gradient(ellipse at 20% 0,#303746 0,transparent 65%),#191d24}

.shell{display:flex;min-height:510px}.sidebar{width:177px;flex-shrink:0;background:var(--pane);border-right:1px solid var(--line);padding:19px 11px;display:flex;flex-direction:column;gap:5px}.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:5px;font-size:12px;position:relative}.nav.active{background:var(--tint);color:var(--accent);font-weight:600}.nav.active:before{content:"";width:3px;height:17px;position:absolute;left:0;top:11px;border-radius:2px;background:var(--accent)}.sidebar .bottom{margin-top:auto;font-size:11px;color:var(--muted);padding:8px 11px;line-height:1.7}
.content{padding:28px;flex:1;min-width:0} h2{font-size:23px;letter-spacing:-.5px;font-weight:600;margin:0 0 6px}.sub{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}h3{font-size:12px;font-weight:600;margin:0}.muted{color:var(--muted)}.small{font-size:11px;line-height:1.6}.status-card{display:flex;align-items:center;gap:13px;background:var(--good);border:1px solid color-mix(in srgb,var(--green) 15%,transparent);border-radius:8px;padding:18px;margin:23px 0 0}.status-symbol{width:37px;height:37px;border-radius:50%;background:color-mix(in srgb,var(--green) 14%,transparent);display:grid;place-items:center;color:var(--green);font-size:19px}.status-card strong{font-size:15px;font-weight:600}.status-card p{margin:4px 0 0;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px}.pill{font-size:10px;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--pane);border-radius:20px;padding:4px 8px;white-space:nowrap}
.button{border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:11px;padding:8px 12px;white-space:nowrap}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.dark .button.primary{color:#182134}.link{border:0;background:transparent;color:var(--accent);padding:4px 0;font-size:11px}.phone-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.phone-icon{width:30px;height:35px;border:1px solid var(--line);border-radius:6px;background:var(--pane);display:grid;place-items:center}.phone-icon svg{width:14px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.4}.phone-info{flex:1}.phone-name{font-size:12px;font-weight:500}.phone-info small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.phone-row .pill{color:var(--green)}
.setting{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:10px;font-size:12px}.setting .detail{font-size:10px;color:var(--muted);margin-top:4px}.toggle{width:31px;height:17px;border-radius:20px;border:0;padding:2px;background:var(--accent);display:flex;align-items:center;justify-content:flex-end}.toggle.off{background:var(--muted);justify-content:flex-start}.toggle:before{content:"";width:13px;height:13px;border-radius:50%;background:white}.field{border:1px solid var(--line);background:var(--pane);padding:5px 8px;border-radius:4px;color:var(--ink);font-size:11px;max-width:125px}.footline{margin-top:20px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}
.popup{border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);padding:18px 19px 16px;position:relative}.popup .popup-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);margin-bottom:16px}.popup .brand{font-size:11px;color:var(--ink)}.popup .logo{width:20px;height:20px}.popup .close{position:absolute;right:13px;top:14px;border:0;background:transparent;color:var(--muted);font-size:16px}.popup-top .time{margin-right:22px}.code-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.code{font-size:35px;letter-spacing:3px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}.popup .button{padding:9px 13px}.sms{font-size:12px;line-height:1.8;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;max-height:125px;overflow:auto;margin:0}.popup-bottom{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:17px}.empty-title{font-size:17px;letter-spacing:0}.popup-closed{min-height:244px;display:grid;place-content:center;gap:12px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--pane);color:var(--muted);font-size:12px}.failure{font-size:11px;color:#c2483a;margin:12px 0 0}
.pairing{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}.pairing-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}.pairing-inner{padding:20px;text-align:center}.pairing h3{font-size:17px;letter-spacing:-.3px;margin-bottom:6px}.pairing .sub{font-size:11px}.qr-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);padding:10px;margin:17px 0 9px;background:white;border-radius:7px}.qr{width:116px;height:116px}.qr-overlay{position:absolute;inset:0;background:#fffffff2;display:grid;place-content:center;gap:9px;color:#333;font-size:12px;border-radius:6px}.qr-note{font-size:9px;color:var(--muted);letter-spacing:.2px;margin-bottom:9px}.expires{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}.expires .dot{background:#c88930;width:5px;height:5px;margin:0}.pairing-footer{background:var(--pane);padding:11px 18px;font-size:10px;line-height:1.65;color:var(--muted)}
.notes{margin-top:30px;padding:0 2px;display:grid;grid-template-columns:36px 1fr;gap:15px}.index{font-size:26px;font-weight:300;color:var(--accent);line-height:1.1}.notes h3{font-size:15px;margin-bottom:7px;font-weight:600}.notes p{font-size:12px;line-height:1.85;color:var(--muted);margin:0;max-width:660px}.chips{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}.chip{font-size:10px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);background:color-mix(in srgb,var(--surface) 50%,transparent)}
.state-line{font-size:10px;color:var(--muted);margin-top:25px;line-height:1.8;max-width:750px}.state-line b{color:var(--ink);font-weight:500}.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:8px;border-radius:13px;background:#172232;color:#fff;box-shadow:0 8px 35px #1114;z-index:20}.switcher button{border:0;background:transparent;color:#abb8c9;font-size:12px;border-radius:7px;padding:10px 14px}.switcher button.selected{color:white;background:#34445c}.switcher .arrow{font-size:16px;padding:7px 12px}.switcher .divider{height:21px;width:1px;background:#ffffff25}.switcher-label{font-size:10px;color:#9bacc1;padding:0 10px}
/* B: a small tray utility, with a single vertical reading order. */
.variant-B{--accent:#21746e;--tint:#eaf4f1;background:radial-gradient(ellipse at 25% 5%,#f8fcfa 0,transparent 60%),#eef1ef}.variant-B.dark{--accent:#90d0c1;--tint:#283e39}.variant-B .workspace{grid-template-columns:minmax(0,1fr) 366px}.variant-B .window{width:492px;margin:0 auto;min-height:555px}.variant-B .titlebar{border-bottom:0;background:var(--surface)}.variant-B .content{padding:10px 29px 20px}.compact-heading{display:flex;align-items:center;justify-content:space-between}.compact-heading .status-symbol{width:45px;height:45px}.compact-heading h2{font-size:27px;margin-top:14px}.compact-heading .pill{color:var(--green);background:var(--good);border:0}.variant-B .section-head{margin-top:23px}.variant-B .phone-row{padding:11px 0}.variant-B .phone-icon{width:27px;height:31px}.compact-settings{margin-top:17px;padding:0 13px;border:1px solid var(--line);border-radius:7px;background:var(--pane)}.compact-settings .setting:last-child{border:0}.compact-settings .setting{padding:10px 0}.utility-footer{display:flex;justify-content:space-between;align-items:center;margin-top:19px;font-size:10px;color:var(--muted)}.variant-B .popup{border-left:3px solid var(--accent);border-radius:7px}.variant-B .code-line{flex-direction:column;align-items:flex-start;gap:14px}.variant-B .popup .code{font-size:39px;letter-spacing:4px}.variant-B .popup .button.primary{width:100%}.variant-B .popup .sms{margin-top:2px}.variant-B .pairing-inner{display:grid;grid-template-columns:1fr 138px;text-align:left;align-items:center;gap:12px;padding:21px 17px}.variant-B .pairing-inner h3{font-size:17px;line-height:1.4}.variant-B .qr-wrap{margin:0 0 8px;padding:8px}.variant-B .qr{width:112px;height:112px}.variant-B .qr-note{text-align:center;margin:0}.variant-B .expires{justify-content:flex-start;margin-top:15px}
/* C: a wide status workspace, horizontal navigation and a persistent settings rail. */
.variant-C{--accent:#735cc2;--tint:#f1eef8}.variant-C.dark{--accent:#c1b1fa;--tint:#39324d}.tabs{height:47px;border-bottom:1px solid var(--line);display:flex;align-items:end;padding:0 25px;gap:25px;background:var(--pane)}.tabs .nav{border-radius:0;padding:12px 2px;font-size:11px}.tabs .nav.active{background:transparent}.tabs .nav.active:before{height:2px;width:100%;top:auto;bottom:0;left:0}.dashboard{padding:27px;display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:28px;min-height:461px}.dashboard .large-status{font-size:38px;letter-spacing:-1.3px;font-weight:400;margin:15px 0 9px;line-height:1.1}.dashboard .ready-label{font-size:10px;color:var(--green);letter-spacing:1px;text-transform:uppercase}.dashboard .settings-rail{border-left:1px solid var(--line);padding-left:23px}.dashboard .settings-rail h3{font-size:12px;margin-bottom:11px}.dashboard .setting{display:block;padding:14px 0}.dashboard .setting .value{margin-top:9px;display:flex;justify-content:space-between;align-items:center}.dashboard .setting .field{max-width:145px;width:100%}.dashboard .section-head{margin-top:27px}.dashboard .phone-row{padding:12px 0}.dashboard .footline{line-height:1.6}.variant-C .popup{padding:19px 21px;border-radius:10px}.variant-C .popup .code-line{border-left:2px solid var(--accent);padding-left:13px;display:block}.variant-C .popup .code{font-size:40px;letter-spacing:4px}.variant-C .popup .code-line .button{margin-top:13px;width:100%}.variant-C .pairing-inner{padding-top:18px;padding-bottom:16px}.variant-C .pairing-head{border-bottom:0;padding-bottom:0;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}.variant-C .qr{width:106px;height:106px}.variant-C .qr-wrap{margin-top:13px}
.warning.status-card{background:var(--pane);border-color:var(--line)}.warning .status-symbol{color:#b17d27;background:#b17d2715}.warning strong{font-size:14px}.attention{color:#b17d27!important}.hidden{display:none!important}.inline-feedback{margin-top:12px;font-size:11px;color:var(--muted)}.settings-full .setting{padding:20px 0}.settings-full .field{max-width:155px}.status-caption{margin-top:11px;font-size:10px;color:var(--muted)}.stub-note{font-size:10px;color:var(--muted);margin-top:15px}
@media(max-width:1100px){.board{padding:28px 24px 110px}.workspace{grid-template-columns:minmax(0,1fr) 330px;gap:20px}.variant-B .workspace{grid-template-columns:minmax(0,1fr) 330px}.sidebar{width:145px}.content{padding:21px}.dashboard{gap:19px;padding:20px;grid-template-columns:minmax(0,1fr) 170px}.dashboard .settings-rail{padding-left:15px}.variant-B .window{width:100%}.preview-controls{flex-wrap:wrap;justify-content:flex-end}}

@media(max-width:560px){.right{grid-template-columns:1fr}.sidebar{width:110px;padding:15px 5px}.nav{padding:11px 7px;font-size:11px}.dashboard{grid-template-columns:1fr}.dashboard .settings-rail{border:0;padding:0}.mast{display:block}.preview-controls{max-width:none;justify-content:flex-start;margin-top:15px}h1{font-size:25px}.board{padding:24px 15px 110px}.content{padding:19px}.window{min-height:540px}.setting{font-size:11px}.switcher .arrow{padding:7px}}

<body>
<main class="board" id="board">
  <header class="mast">
    <div><div class="eyebrow">Pin Glide · Windows receiver · UI study</div><h1 id="heading"></h1><p class="intro" id="intro"></p></div>
    <div class="preview-controls" aria-label="Prototype controls">
      <select id="scenario" class="control" aria-label="Preview scenario">
        <option value="ready">Ready · OTP message</option>
        <option value="no-otp">Ready · no OTP</option>
        <option value="offline">Not Ready · reconnecting</option>
        <option value="expired">QR expired</option>
        <option value="copy-failed">Clipboard write failed</option>
        <option value="key">One phone needs attention</option>
      </select>
      <button class="control" id="theme">Dark preview</button>
    </div>
  </header>
  <div class="workspace">
    <section class="left">
      <div class="surface-label">01 / Main window <span>Opened explicitly; close to tray</span></div>
      <div class="window" id="app"></div>
      <div class="notes"><div class="index" id="index"></div><div><h3 id="principle"></h3><p id="description"></p><div class="chips" id="chips"></div></div></div>
      <div class="state-line" id="state" aria-live="polite"></div>
    </section>
    <aside class="right">
      <section><div class="surface-label">02 / Independent SMS popup <span>Non-activating · 30 s default</span></div><div id="popup"></div></section>
      <section><div class="surface-label">03 / Pairing window <span>Same direction, separate surface</span></div><div id="pairing"></div></section>
    </aside>
  </div>
</main>
<nav class="switcher" aria-label="UI direction">
  <button class="arrow" id="prev" aria-label="Previous direction">←</button><span class="divider"></span>
  <button data-variant="A">A · Native Fluent</button><button data-variant="B">B · Quiet utility</button><button data-variant="C">C · Status workspace</button>
  <span class="divider"></span><button class="arrow" id="next" aria-label="Next direction">→</button>
  <span class="switcher-label">STYLE STUDY / NOT PRODUCT UI</span>
</nav>
<script>
const directions={
 A:{name:"Native Fluent",intro:"A familiar settings window. Calm surfaces, clear navigation, Windows-first proportions.",principle:"Familiar by design.",description:"A left rail keeps receiver status and settings predictable. Connected phones sit above secondary preferences; pairing stays one click away. The SMS popup balances the code, its copy action, and the complete message.",chips:["Persistent left navigation","Standard control density","Code + action on one line"]},
 B:{name:"Quiet utility",intro:"A compact companion for the tray. One column, one clear status, very little ceremony.",principle:"Small enough to stay out of the way.",description:"A narrow tool window puts readiness first and keeps everyday preferences in place. Pairing is the primary action. The popup gives the code a larger target and a full-width copy button for quick, deliberate use.",chips:["Compact single column","Inline preferences","Large full-width copy action"]},
 C:{name:"Status workspace",intro:"A wider, more expressive desktop surface. Status on the left, preferences within reach.",principle:"Make the current state unmistakable.",description:"Horizontal navigation opens a spacious receiver view with a persistent settings rail. Large status typography makes readiness easy to read. The popup uses an accent rule and a clear vertical order: code, action, original SMS.",chips:["Horizontal navigation","Split status + settings","Strong typographic hierarchy"]}
};
const params=new URLSearchParams(location.search);
let variant=Object.hasOwn(directions,params.get("variant"))?params.get("variant"):"A";
let dark=params.get("theme")==="dark",scenario="ready",page="receiver",popupOpen=true,mainOpen=true,startup=true,shortcut="",duration="30",popupDuration="30";
// The approved icon attachment was inaccessible; this monogram is a preview placeholder.
const logo='<span class="logo" aria-label="Temporary brand placeholder">P</span>';
const brand=`<span class="brand">${logo}<span>鹊信 <span class="muted" style="font-weight:400">/ Pin Glide</span></span></span>`;
const phoneIcon='<span class="phone-icon"><svg viewBox="0 0 18 24" aria-hidden="true"><rect x="3" y="1" width="12" height="22" rx="2"/><path d="M7 4h4M8 20h2"/></svg></span>';
function titlebar(){return `<div class="titlebar">${brand}<div class="win-buttons"><span aria-hidden="true">−</span><span aria-hidden="true">□</span><button class="window-close" data-action="hide-main" aria-label="Hide main window to tray">×</button></div></div>`}
function status(compact=false){const offline=scenario==="offline";return `<div class="status-card ${offline?"warning":""}"><div class="status-symbol" aria-hidden="true">${offline?"↻":"✓"}</div><div><strong>${offline?"Not Ready":"Ready"}</strong><p>${offline?"Connection interrupted. Retrying automatically.":"Connected. Ready to receive new messages."}</p></div></div>`}
function phones(){return ["Pixel 9","Galaxy S24"].map((name,i)=>`<div class="phone-row">${phoneIcon}<div class="phone-info"><div class="phone-name">${name}</div><small>${i===0&&scenario==="key"?"Remove the old pairing on this phone, then add again.":"Paired with this receiver"}</small></div><span class="pill ${i===0&&scenario==="key"?"attention":""}">${i===0&&scenario==="key"?"Needs attention":"Paired"}</span></div>`).join("")}
function settings(compact=false){return `<div class="setting"><div>Launch at login${compact?"":'<div class="detail">Start quietly in the system tray</div>'}</div><button class="toggle ${startup?"":"off"}" data-action="startup" role="switch" aria-checked="${startup}" aria-label="Launch at login"></button></div><div class="setting"><div>Copy shortcut${compact?"":'<div class="detail">Copy the latest available code</div>'}</div><button class="button" data-action="shortcut">${shortcut||"Unassigned"}</button></div><div class="setting"><div>Popup duration${compact?"":'<div class="detail">Applies to new popups</div>'}</div><select class="field duration" aria-label="Popup duration"><option value="15" ${duration==="15"?"selected":""}>15 seconds</option><option value="30" ${duration==="30"?"selected":""}>30 seconds</option><option value="60" ${duration==="60"?"selected":""}>60 seconds</option></select></div>`}
function settingsPage(){return `<div class="content settings-full"><h2>Settings</h2><p class="sub">Keep Pin Glide working the way you prefer.</p>${settings()}<div class="stub-note">Preview controls only. No Windows settings are changed.</div><button class="link" data-action="receiver" style="margin-top:17px">← Back to receiver</button></div>`}
function renderApp(){
 if(!mainOpen){document.querySelector("#app").innerHTML=`<div class="popup-closed" style="min-height:555px"><div>Main window hidden to tray</div><div class="small">Reception continues independently of this window.</div><button class="button" data-action="show-main">Open window</button></div>`;return}
 const head=titlebar(),add='<button class="button primary" data-action="pair">+ Pair a phone</button>';
 let html;
 if(variant==="A")html=head+`<div class="shell"><nav class="sidebar" aria-label="Main navigation"><button class="nav ${page==="receiver"?"active":""}" data-action="receiver"><span aria-hidden="true">▣</span> Receiver</button><button class="nav ${page==="settings"?"active":""}" data-action="settings"><span aria-hidden="true">⚙</span> Settings</button><div class="bottom">Private by design<br>SMS content stays in memory.</div></nav>${page==="settings"?settingsPage():`<div class="content"><h2>Your receiver</h2><p class="sub">Messages from your phone, right where you work.</p>${status()}<div class="section-head"><h3>Paired phones <span class="muted">· 2</span></h3>${add}</div>${phones()}<div class="section-head"><h3>Quick settings</h3><button class="link" data-action="settings">All settings →</button></div>${settings(true)}<div class="footline"><span>No SMS history is stored.</span><span>Runs in your system tray</span></div></div>`}</div>`;
 if(variant==="B")html=head+(page==="settings"?settingsPage():`<div class="content"><div class="compact-heading"><div><div class="status-symbol" aria-hidden="true">${scenario==="offline"?"↻":"✓"}</div><h2>${scenario==="offline"?"Not Ready":"Ready"}</h2></div><span class="pill">${scenario==="offline"?"Reconnecting":"Receiver connected"}</span></div><p class="sub">${scenario==="offline"?"Retrying automatically. No action needed.":"Waiting quietly for your next message."}</p><div class="section-head"><h3>Your phones <span class="muted">· 2</span></h3>${add}</div>${phones()}<div class="compact-settings">${settings(true)}</div><div class="utility-footer"><span>No message history</span><button class="link" data-action="settings">Settings ↗</button></div></div>`);
 if(variant==="C")html=head+`<nav class="tabs" aria-label="Main navigation"><button class="nav ${page==="receiver"?"active":""}" data-action="receiver">Receiver</button><button class="nav ${page==="settings"?"active":""}" data-action="settings">Settings</button></nav>`+(page==="settings"?settingsPage():`<div class="dashboard"><div><div class="ready-label"><span class="dot"></span>Receiver status</div><div class="large-status">${scenario==="offline"?"Not Ready":"Ready"}</div><p class="sub">${scenario==="offline"?"Reconnecting automatically.":"A quiet connection between your phone and your desktop."}</p><div class="section-head"><h3>Paired phones <span class="muted">· 2</span></h3></div>${phones()}<div style="margin-top:19px">${add}</div><div class="footline">Only new messages are received.<br>No SMS history is stored.</div></div><aside class="settings-rail"><h3>Everyday preferences</h3><p class="sub">Always within reach.</p><div class="setting">Launch at login<div class="value"><span class="small muted">Tray only</span><button class="toggle ${startup?"":"off"}" data-action="startup" role="switch" aria-checked="${startup}" aria-label="Launch at login"></button></div></div><div class="setting">Copy shortcut<div class="value"><button class="button" data-action="shortcut">${shortcut||"Unassigned"}</button></div><div class="detail">Latest available code</div></div><div class="setting">Popup duration<div class="value"><select class="field duration" aria-label="Popup duration"><option value="15" ${duration==="15"?"selected":""}>15 seconds</option><option value="30" ${duration==="30"?"selected":""}>30 seconds</option><option value="60" ${duration==="60"?"selected":""}>60 seconds</option></select></div></div><p class="stub-note">Closing this window keeps reception running.</p></aside></div>`);
 document.querySelector("#app").innerHTML=html;
}
function renderPopup(){
 const target=document.querySelector("#popup");
 if(!popupOpen){target.innerHTML='<div class="popup-closed"><div>Popup closed</div><div class="small">The message body is released.<br>The latest code remains in memory.</div><button class="button" data-action="reset-popup">Show sample again</button></div>';return}
 const noOtp=scenario==="no-otp";
 // Keep the agreed fixed test SMS unchanged; UI chrome uses English preview copy.
 const sms=noOtp?"[Pin Glide] Your parcel is ready for collection at the front desk. Please collect it before 20:00.":"\u3010\u9e4a\u4fe1\u3011\u8fd9\u662f\u4e00\u6761\u6d4b\u8bd5\u77ed\u4fe1\uff0c\u9a8c\u8bc1\u7801 482913\u3002\u8bf7\u52ff\u7528\u4e8e\u771f\u5b9e\u767b\u5f55\u3002";
 target.innerHTML=`<article class="popup"><div class="popup-top">${brand}<span class="time">Just now</span></div><button class="close" data-action="close-popup" aria-label="Close SMS popup">×</button><div class="code-line">${noOtp?'<div class="empty-title">New message</div>':`<div class="code">482913</div><button class="button primary" data-action="copy">Copy code</button>`}</div><p class="sms">${sms}</p>${scenario==="copy-failed"?'<p class="failure" role="alert">Could not copy. Try again.</p>':""}<div class="popup-bottom"><span>From Pixel 9</span><span>${noOtp?"No verification code":`Closes after ${popupDuration} s`}</span></div></article>`;
}
function qr(){
 // Deliberately non-scannable artwork: never represents a real Pairing Session.
 let rects='<rect width="29" height="29" fill="white"/>';
 for(let y=0;y<29;y++)for(let x=0;x<29;x++){if((x<9&&y<9)||(x>19&&y<9)||(x<9&&y>19))continue;if(((x*7+y*13+x*y)%11)<5)rects+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 for(const [x,y] of [[1,1],[21,1],[1,21]])rects+=`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="white"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 return `<svg class="qr" viewBox="0 0 29 29" shape-rendering="crispEdges" aria-label="Decorative QR placeholder, not scannable">${rects}</svg>`
}
function renderPairing(){
 const expired=scenario==="expired";
 const qrBlock=`<div><div class="qr-wrap">${qr()}${expired?'<div class="qr-overlay"><strong>QR code expired</strong><button class="button primary" data-action="refresh">Refresh code</button></div>':""}</div><div class="qr-note">QR PLACEHOLDER · NOT SCANNABLE</div></div>`;
 const text=`<h3>Pair your phone</h3><p class="sub">Open Pin Glide on Android.<br>Scan this code and confirm.</p>`;
 const expiry=`<div class="expires"><span class="dot"></span>${expired?"Expired · refresh when ready":"Valid for 5 minutes · 04:32 remaining"}</div>`;
 document.querySelector("#pairing").innerHTML=`<article class="pairing"><div class="pairing-head"><span>Pair a phone</span><span class="muted" aria-hidden="true">↗</span></div><div class="pairing-inner">${variant==="B"?`<div>${text}${expiry}</div>${qrBlock}`:`${text}${qrBlock}${expiry}`}</div><div class="pairing-footer">Existing phones keep receiving. Closing the pairing window leaves pairing in progress.</div></article>`;
}
function renderState(){document.querySelector("#state").innerHTML=`<b>Prototype state</b> · ${variant} / ${dark?"Dark":"Light"} / ${scenario} / ${page} / shortcut: ${shortcut||"unassigned"} / startup: ${startup?"on":"off"} / popup duration: ${duration}s<br>All directions use the same approved behavior. Preview only: QR, connection, timer, clipboard and Windows integration are simulated.`}
function render(){
 const d=directions[variant];document.querySelector("#board").className=`board variant-${variant}${dark?" dark":""}`;
 document.querySelector("#heading").textContent=`${variant} / ${d.name}`;
 document.querySelector("#intro").textContent=d.intro;
 document.querySelector("#index").textContent={A:"01",B:"02",C:"03"}[variant];
 document.querySelector("#principle").textContent=d.principle;document.querySelector("#description").textContent=d.description;
 document.querySelector("#chips").innerHTML=d.chips.map(c=>`<span class="chip">${c}</span>`).join("");
 document.querySelectorAll("[data-variant]").forEach(b=>{b.classList.toggle("selected",b.dataset.variant===variant);b.setAttribute("aria-current",b.dataset.variant===variant?"true":"false")});
 document.querySelector("#theme").textContent=dark?"Light preview":"Dark preview";
 renderApp();renderPopup();renderPairing();renderState();
 const url=new URL(location.href);url.searchParams.set("variant",variant);dark?url.searchParams.set("theme","dark"):url.searchParams.delete("theme");history.replaceState(null,"",url);
}
function cycle(delta){variant=["A","B","C"][(["A","B","C"].indexOf(variant)+delta+3)%3];render()}
document.addEventListener("click",e=>{
 const choice=e.target.closest("[data-variant]");if(choice){variant=choice.dataset.variant;render();return}
 const action=e.target.closest("[data-action]")?.dataset.action;if(!action)return;
 if(action==="receiver"||action==="settings")page=action;
 if(action==="startup")startup=!startup;
 if(action==="shortcut")shortcut=shortcut?"":"Ctrl + Alt + V";
 if(action==="close-popup")popupOpen=false;
 if(action==="copy"&&scenario!=="copy-failed")popupOpen=false;
 if(action==="reset-popup"){popupOpen=true;popupDuration=duration}
 if(action==="hide-main")mainOpen=false;
 if(action==="show-main")mainOpen=true;
 if(action==="pair"){document.querySelector("#pairing").scrollIntoView({behavior:"smooth",block:"nearest"});document.querySelector(".pairing").animate([{outline:"3px solid var(--accent)"},{outline:"3px solid transparent"}],{duration:1000});return}
 if(action==="refresh"){scenario="ready";document.querySelector("#scenario").value=scenario}
 render();
});
document.querySelector("#prev").onclick=()=>cycle(-1);document.querySelector("#next").onclick=()=>cycle(1);
document.querySelector("#theme").onclick=()=>{dark=!dark;render()};
document.querySelector("#scenario").onchange=e=>{scenario=e.target.value;popupOpen=true;popupDuration=duration;render()};
document.addEventListener("change",e=>{if(e.target.matches(".duration")){duration=e.target.value;renderApp();renderState()}});
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,[contenteditable]"))return;if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();cycle(e.key==="ArrowRight"?1:-1)}});
window.addEventListener("popstate",()=>{const p=new URLSearchParams(location.search);variant=Object.hasOwn(directions,p.get("variant"))?p.get("variant"):"A";dark=p.get("theme")==="dark";render()});
render();
</script>
</body>
</html>
